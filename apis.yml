name: Cortina Systems
description: >-
  Cortina Systems, Inc. was a venture-backed fabless semiconductor company
  founded in 2001 and headquartered in Sunnyvale, California, that designed
  high-speed communications and networking integrated circuits for optical
  transport, carrier Ethernet, framer/mapper and PHY devices, and broadband
  access (EPON/GPON and DSL). The company grew through acquisitions and was
  itself acquired by Inphi Corporation in 2014; Inphi later merged into Marvell
  Technology in 2021, and the cortina-systems.com domain now redirects to
  Marvell. Cortina was surfaced in the API Evangelist network as a portfolio
  company of Canaan Partners. It is a hardware semiconductor business with no
  public developer platform or API surface, so no API artifacts apply.
